name: Check Model Generation

on:
    workflow_call:

permissions:
    contents: read

jobs:
    check_model_generation:
        name: Check Model Generation
        runs-on: [self-hosted, cgi]
        container:
            image: spcbo-registry-ext.vcs.de/govsatcom/psi/psi-dev-images/psi-dev:latest
            options: --user 1001:1001
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure Gradle cache
              uses: ./.github/actions/gradle-cache

            - name: Check model generation
              run: task check:confirm-model-generation

            - name: Upload changed models
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: generated-model-changes
                  path: source/common/src/main/java/com/cgi/space/psi/common/model/
                  if-no-files-found: warn
                  retention-days: 2
