name: Pull Request CI

on: pull_request

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
            testdata: ${{ steps.filter.outputs.testdata }}
            documents: ${{ steps.filter.outputs.documents }}
        steps:
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              with:
                  filters: |
                      code:
                        - 'Taskfile.yml'
                        - 'Taskfile.build.yml'
                        - 'Taskfile.test.yml'
                        - 'Taskfile.check.yml'
                        - 'build.gradle'
                        - 'settings.gradle'
                        - 'gradle.properties'
                        - 'buildSrc/**/*.{java,gradle,groovy}'
                        - 'source/**/*.{java,gradle,yml,config,json,toml,sql,py}'
                      testdata:
                        - 'aiv/testing/testdata/**'
                      documents:
                        - 'Taskfile.yml'
                        - 'aiv/rhod/Taskfile.yml'
                        - 'doc/**'
                        - 'aiv/rhod/**'

    test_document_build:
        name: Document Test Build
        uses: ./.github/workflows/document-build.yml
        needs: changes
        if: ${{ needs.changes.outputs.documents == 'true' }}
        with:
            draft: true

    build:
        name: Test Build
        needs: changes
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: ./.github/workflows/build.yml

    unit_tests:
        name: Unit Tests
        needs:
            - changes
            - build
        if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.testdata == 'true' }}
        uses: ./.github/workflows/unit-tests.yml

    code_docs:
        name: Code Documentation Test Build
        needs:
            - changes
            - build
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: ./.github/workflows/code-docs.yml

    check_doc_generation:
        name: Check Document Generation
        needs: changes
        uses: ./.github/workflows/check-doc-generation.yml

    check_model_generation:
        name: Check Model Generation
        needs: changes
        uses: ./.github/workflows/check-model-generation.yml
