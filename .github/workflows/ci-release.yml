name: Release CI

on:
    push:
        tags:
            - "*"

jobs:
    build:
        name: Release Build
        uses: ./.github/workflows/build.yml

    unit_tests:
        name: Unit Tests
        needs: build
        uses: ./.github/workflows/unit-tests.yml

    code_docs:
        name: Code Documentation Release Build
        needs: build
        uses: ./.github/workflows/code-docs.yml

    document_build:
        name: Document Release Build
        uses: ./.github/workflows/document-build.yml
        with:
            draft: false

    release:
        name: Release
        runs-on: ubuntu-latest
        needs:
            - build
            - unit_tests
            - code_docs
            - document_build
        permissions:
            contents: write
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: documents
            - name: Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  fail_on_unmatched_files: true
                  files: |
                      *.pdf
                      *.zip
