name: Document CI

on:
    pull_request:
        paths:
            - "doc/**"
            - "aiv/rhod/**"

jobs:
    build_docs:
        runs-on: [self-hosted, cgi]
        container:
            image: spcbo-registry-ext.vcs.de/govsatcom/psi/psi-dev-images/psi-dev:latest
            options: --user 1001:1001
        env:
            DRAFT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run RHOD
              run: bash ./aiv/rhod/rhod-playbook.sh

            - name: Upload generated documents
              uses: actions/upload-artifact@v4
              with:
                  name: documents
                  path: .pdfout/*.pdf
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 2
