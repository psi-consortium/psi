name: Document Build

on:
    workflow_call:
        inputs:
            draft:
                required: true
                type: boolean

jobs:
    build_docs:
        runs-on: [self-hosted, cgi]
        container:
            image: spcbo-registry-ext.vcs.de/govsatcom/psi/psi-dev-images/psi-dev:latest
            options: --user 1001:1001
        env:
            DRAFT: ${{ inputs.draft && '1' || '0' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Run RHOD
              run: bash ./aiv/rhod/rhod-playbook.sh

            - name: Upload generated documents
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: documents
                  path: .pdfout/*.pdf
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 2
