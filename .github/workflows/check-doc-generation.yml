name: Check Document Generation

on:
    workflow_call:

permissions:
    contents: read

jobs:
    check_doc_generation:
        name: Check Document Generation
        runs-on: [self-hosted, cgi]
        container:
            image: spcbo-registry-ext.vcs.de/govsatcom/psi/psi-dev-images/psi-dev:latest
            options: --user 1001:1001
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Configure Gradle cache
              uses: ./.github/actions/gradle-cache

            - name: Check document generation
              run: task check:confirm-doc-generation

            - name: Upload changed documents
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: generated-document-changes
                  path: doc/
                  if-no-files-found: warn
                  retention-days: 2
